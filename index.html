<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rabbit-Hole — Letter Strings</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="c"></canvas>
  <button id="toggle">☰</button>
  <div id="panel">
    <h2>Physics</h2>
    <div class="row"><label>Gravity<span id="vG"></span></label>
      <input id="sG" type="range" min="0" max="1.2" step="0.01"></div>
    <div class="row"><label>Damping<span id="vD"></span></label>
      <input id="sD" type="range" min="0.85" max="0.999" step="0.001"></div>
    <div class="row"><label>Spring (return)<span id="vS"></span></label>
      <input id="sS" type="range" min="0" max="0.25" step="0.005"></div>
    <div class="row"><label>Cursor radius<span id="vR"></span></label>
      <input id="sR" type="range" min="20" max="200" step="1"></div>
    <div class="row"><label>Cursor push<span id="vP"></span></label>
      <input id="sP" type="range" min="0" max="20" step="0.5"></div>
    <div class="row"><label>Stiffness (iters)<span id="vI"></span></label>
      <input id="sI" type="range" min="1" max="12" step="1"></div>
    <div class="btns">
      <button id="reset">Reset</button>
      <button id="hide">Hide</button>
    </div>
  </div>
  <div id="hint">Move your cursor over the text to see the effect</div>
  <script src="script.js"></script>
</body>
</html>
